# ============================================================================
# Daily Software Stock Memo - Configuration
# ============================================================================

# Data source configuration
data_source:
  # Options: "bloomberg", "yahoo"
  # "bloomberg" requires Bloomberg Terminal + blpapi Python SDK
  # "yahoo" uses yfinance (free, no license required)
  provider: "yahoo"

  bloomberg:
    host: "localhost"
    port: 8194

