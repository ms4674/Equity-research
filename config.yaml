# Memo generation settings
memo:
  # Number of top movers to feature in the memo (gainers + losers each)
  top_movers_count: 5

  # Minimum absolute percent change to be considered a "notable mover"
  min_move_threshold: 1.0

  # Output format: "markdown", "html", "text"
  output_format: "markdown"

  # Output directory
  output_dir: "output"

  # Include sector performance summary
  include_sector_summary: true

  # Include volume analysis
  include_volume_analysis: true

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
